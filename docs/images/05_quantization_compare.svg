<text x="24" y="450" font-size="11" fill="#57606a">PPL（パープレキシティ）は文章の続きの予想の外れ具合。日本語でも同じ傾向（NF4 +0.2%、HQQ 3bit +50.8%）。</text>
<text x="24" y="466" font-size="11" fill="#57606a">10問は1問ずつの差がぶれやすい（bf16 も1問落としている）。</text>
<text x="24" y="482" font-size="11" fill="#57606a">8bit と HQQ が遅いのは計算方法のため（8bit は外れ値を別処理、HQQ は毎回ほどいてから計算）。速さは 04 の vLLM + AWQ へ。</text>
