<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
  <rect width="760" height="300" rx="12" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#1f2328">ChatGPT のどのモデルに近い？（GPQA Diamond の点数）</text>
  <text x="24" y="58" font-size="13" fill="#57606a">大学院レベルの理系問題の正答率。右ほど賢い。</text>

  <!-- axis: 40% -> x=60, 90% -> x=700 ; 12.8px per % -->
  <line x1="60" y1="170" x2="700" y2="170" stroke="#57606a" stroke-width="2"/>
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <line x1="60" y1="165" x2="60" y2="175" stroke="#57606a"/><text x="60" y="192">40%</text>
    <line x1="188" y1="165" x2="188" y2="175" stroke="#57606a"/><text x="188" y="192">50%</text>
    <line x1="316" y1="165" x2="316" y2="175" stroke="#57606a"/><text x="316" y="192">60%</text>
    <line x1="444" y1="165" x2="444" y2="175" stroke="#57606a"/><text x="444" y="192">70%</text>
    <line x1="572" y1="165" x2="572" y2="175" stroke="#57606a"/><text x="572" y="192">80%</text>
    <line x1="700" y1="165" x2="700" y2="175" stroke="#57606a"/><text x="700" y="192">90%</text>
  </g>

  <!-- OpenAI (above) -->
  <g font-size="13" fill="#57606a" text-anchor="middle">
    <circle cx="188" cy="170" r="6" fill="#8c959f"/>
    <line x1="188" y1="164" x2="188" y2="130" stroke="#8c959f"/><text x="188" y="124">GPT-4o（約50%）</text>

    <circle cx="572" cy="170" r="6" fill="#8c959f"/>
    <line x1="572" y1="164" x2="572" y2="140" stroke="#8c959f"/><text x="540" y="134">o3-mini（約80%）</text>

    <rect x="610" y="163" width="51" height="14" rx="7" fill="#8c959f" opacity="0.6"/>
    <line x1="636" y1="163" x2="636" y2="108" stroke="#8c959f"/><text x="636" y="102">o3（約83〜87%）</text>

    <circle cx="668" cy="170" r="6" fill="#8c959f"/>
    <line x1="668" y1="164" x2="668" y2="84" stroke="#8c959f"/><text x="690" y="78">GPT-5（約88%）</text>
  </g>

  <!-- Gemma (below) -->
  <circle cx="627" cy="170" r="9" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
  <line x1="627" y1="180" x2="627" y2="222" stroke="#0969da" stroke-width="2"/>
  <text x="627" y="242" font-size="15" font-weight="bold" fill="#0969da" text-anchor="middle">Gemma 4 31B（84.3%）</text>
  <text x="627" y="262" font-size="12" fill="#0969da" text-anchor="middle">L4 1枚で今回動かしたモデル</text>

  <text x="24" y="288" font-size="11" fill="#57606a">Gemma は Google 公式の値。OpenAI は公表値の目安（未検証）。ベンチマークの点数＝使ったときの賢さではない。</text>
</svg>
