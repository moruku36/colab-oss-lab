<rect x="330" y="448" width="274" height="14" rx="2" fill="#1a7f37"/>
<text x="718" y="460" font-size="12" font-weight="bold" fill="#1a7f37">72%（80%）</text>
<line x1="634" y1="108" x2="634" y2="482" stroke="#cf222e" stroke-dasharray="4 3"/>
<text x="634.0" y="496" font-size="11" text-anchor="middle" fill="#cf222e">目標 80%</text>
<text x="24" y="520" font-size="12" fill="#57606a">資料にない質問 5 問は、どの設定でも 5 / 5 で「資料に記載がありません」と答えた（作り話は増えなかった）</text>
<text x="24" y="540" font-size="12" fill="#57606a">E の残り 7 問の外れ: 採点の言葉のずれ 3、検索しても資料に答えがない 1、正しい段落を拾ったのに答えを取り違えた 3</text>
</svg>
