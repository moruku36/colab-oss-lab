<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 592" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<rect width="860" height="592" rx="12" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="bold" fill="#1f2328">効いたのはリランカー：検索 76% → 92%、正答 64% → 72%</text>
<text x="24" y="58" font-size="13" fill="#57606a">08 と同じ資料（147 段落）・同じ 25 問・同じモデル（Gemma 4 26B-A4B）で、検索のやり方だけを 1 段ずつ変えた</text>
